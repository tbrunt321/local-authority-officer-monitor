name: Local Authority Officer Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 5"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the monitoring software
       run: pip install requests beautifulsoup4 pypdf lxml

      - name: Run the council search
        run: python monitor.py

      - name: Save the results
        run: |
          git config user.name "Local Authority Officer Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update officer monitoring results"
          git push
